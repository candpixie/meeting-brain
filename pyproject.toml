[project]
name = "meeting-brain"
version = "0.1.2"
description = "Private meeting brain: who said what, Cantonese/English, local only"
authors = [
    { name = "Candy Xie", email = "154905277+candpixie@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "fpdf2>=2.9.0",
    "numpy>=2.5.4",
    "opencc-python-reimplemented>=0.1.7",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mb = "mb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mb"]
